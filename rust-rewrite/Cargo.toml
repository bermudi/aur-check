[package]
name = "aur-safe"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
llm = { version = "1.3.8", default-features = false, features = ["rustls-tls", "openai", "anthropic", "ollama", "deepseek", "openrouter"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
nix = { version = "0.29", default-features = false, features = ["fs"] }

[profile.release]
lto = true
